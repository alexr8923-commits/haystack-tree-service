<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Haystack Tree Service</title>
  <meta name="description" content="Contact page to request quotes and emergency services." />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Haystack Tree Service</a>
      <button id="navToggle4" class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav id="siteNav4" class="site-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p>Call us at <strong>(555) 123-4567</strong> or use the form below to request a free quote.</p>

    <!-- Replace the form action with your Formspree endpoint or server endpoint -->
    <form id="contactForm" action="https://formspree.io/f/your-form-id" method="POST">
      <label>
        Your name
        <input type="text" name="name" required>
      </label>
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <label>
        Phone
        <input type="tel" name="phone">
      </label>
      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button class="btn" type="submit">Send Message</button>
      <p id="formMsg" class="form-msg" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div><strong>Haystack Tree Service</strong><p>Phone: (555) 123-4567</p></div>
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="copyright">© <span id="year4"></span> Haystack Tree Service</div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
