name: Deploy to GitHub Pages
on: push: branches:- main
jobs: build-and-deploy: runs-on: ubuntu-latest permisions: contents: read pages: writed id-token:write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Upload static files for Pages
    uses: actions/upload-pages-artifact@v1
    with:
      path: ./

deploy: needs:build-and-deploy runs-on: ubuntu-latest permissions: pages: write id-token: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Upload static files for Pages
    uses: actions/upload-pages-artifact@v1
    with:
      path: ./
